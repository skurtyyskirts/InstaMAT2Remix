# Experimental release workflow.
#
# Manual-trigger only (workflow_dispatch) so it does NOT auto-fire when you push
# a v* tag — the v0.0.1-alpha release is built and verified locally (see docs/PUBLISH.md).
#
# CAVEAT: package_release.ps1 bundles the MSVC runtime by searching this machine's
# VS redist dirs (…\VC\Redist\MSVC\…\Microsoft.VC143.CRT). A hosted runner's VS
# layout may differ, so a CI-built zip may omit the CRT DLLs or windeployqt may
# behave differently. Treat CI-built zips as UNVERIFIED — always sanity-check the
# payload before publishing. To switch to tag-triggered later, uncomment the
# `push: tags` block below.

name: Release InstaMAT2Remix

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to release (e.g. v0.0.1-alpha). Leave blank to use PluginInfo.h."
        required: false
        default: ""
  # push:
  #   tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    name: Package + attach release zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt 6.6
        uses: jurplel/install-qt-action@v3
        with:
          version: "6.6.3"
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: qtwebsockets
          dir: C:\Qt
          cache: true

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build + package
        working-directory: InstaMAT2Remix
        shell: pwsh
        run: .\package_release.ps1

      - name: Verify zip payload
        working-directory: InstaMAT2Remix
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\InstaMAT2Remix-v*-win64.zip | Select-Object -First 1
          if (-not $zip) { throw "No release zip produced." }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $names = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName).Entries.FullName
          $need = 'InstaMAT2RemixPlugin.dll','InstaMAT2RemixExport.exe','texconv.exe','InstaMAT2Remix.IMP'
          foreach ($n in $need) {
            if ($names -match [regex]::Escape($n)) { "OK      $n" }
            else { throw "MISSING $n" }
          }
          foreach ($n in 'vcruntime140.dll','msvcp140.dll') {
            if ($names -match [regex]::Escape($n)) { "OK      $n" }
            else { "WARNING CRT not bundled by CI: $n" }
          }

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: InstaMAT2Remix/dist/InstaMAT2Remix-v*-win64.zip
          generate_release_notes: true
